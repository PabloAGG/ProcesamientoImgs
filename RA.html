
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIKITAKA-RA</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/introjs.min.css"  crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="CSS/RA.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <a href="index.html"><img src="IMG/favicon.png" alt="logo" id="logoprin"></a>
    <button onclick="location.href='index.html'" class="header__home"><i class="fa-solid fa-home"></i></button>
  </header>

  <main class="ra-shell">
    <section class="ra-viewer" aria-label="Escena de realidad aumentada">
      <div class="ra-viewer__stage">
        <div class="stage-placeholder" id="stage-placeholder">
          <i class="fa-solid fa-eye"></i>
          <p>Activa la experiencia RA para escanear banderas del Mundial.</p>
        </div>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas3d" aria-hidden="true"></canvas>
        <canvas id="frameCanvas" width="400" height="200" aria-hidden="true"></canvas>
        <div class="ra-viewer__cards">
          <div id="deteccion-info" class="status-card" style="display:none;">
            <p class="status-card__label">Bandera detectada</p>
            <h3 id="nombre-bandera">-</h3>
            <p id="confianza">Confianza: <span id="valor-confianza">0%</span></p>
            <button class="chip" type="button" onclick="mostrarDatosPais()">Ver datos del país</button>
          </div>
          <div id="animacion-progreso" class="status-card status-card--alert" style="display:none;">
            <p>🎬 Reproduciendo animación...</p>
            <p class="status-card__note">La detección se reanuda al finalizar.</p>
          </div>
        </div>
      </div>

      <aside id="info-panel" class="ra-panel" aria-live="polite">
        <div class="ra-panel__header">
          <div>
            <p class="ra-panel__eyebrow">Experiencia Mundial 2026</p>
            <h2 id="panel-title">Acción rápida</h2>
          </div>
          <button id="panel-close" class="ra-panel__close" type="button" aria-label="Cerrar panel">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="panel-body" class="ra-panel__body">
          <p>Selecciona una acción en el dock para descubrir contenido exclusivo del Mundial.</p>
        </div>
      </aside>
    </section>
  </main>

  <nav id="control-hub" class="control-hub" aria-label="Acciones rápidas">
    <button id="hub-toggle" class="control-hub__toggle" type="button" aria-expanded="false">
      <i class="fa-solid fa-futbol"></i>
      <span>Explorar</span>
    </button>
    <div class="control-hub__actions">
      <button class="hub-btn" type="button" data-action="animacion">
        <i class="fa-solid fa-cube"></i>
        <span>RA</span>
      </button>
      <button class="hub-btn" type="button" data-action="video">
        <i class="fa-solid fa-video"></i>
        <span>Videos</span>
      </button>
      <button class="hub-btn" type="button" data-action="datos">
        <i class="fa-solid fa-chart-simple"></i>
        <span>Datos</span>
      </button>
      <button class="hub-btn" type="button" data-action="trivia">
        <i class="fa-solid fa-clipboard-check"></i>
        <span>Trivia</span>
      </button>
      <button class="hub-btn" type="button" id="btn-iniciar-modelo" style="display:none;" data-action="animar">
        <i class="fa-solid fa-play"></i>
        <span>Anima</span>
      </button>
      <button class="hub-btn hub-btn--alert" type="button" id="btn-diagnostico" style="display:none;" data-action="diagnostico">
        <i class="fa-solid fa-bug"></i>
        <span>Diag</span>
      </button>
    </div>
  </nav>

   <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <!-- Three.js para modelos 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script src="RA.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/intro.min.js"  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script> 
document.addEventListener('DOMContentLoaded', function() {
const INTRO_KEY = 'introRA_v2';

// Solo mostrar el tutorial si no se ha completado antes
if (!localStorage.getItem(INTRO_KEY)) {
  const introSteps = [
    {
      element: document.querySelector('header'),
      intro: "¡Bienvenido a la experiencia inmersiva del Mundial! Desde aquí puedes regresar al inicio cuando quieras.",
      position: 'bottom'
    },
    {
      element: document.getElementById('hub-toggle'),
      intro: "Este botón despliega el dock de acciones rápidas. Úsalo para alternar entre experiencias.",
      position: 'top'
    },
    {
      element: document.querySelector('.hub-btn[data-action="animacion"]'),
      intro: "Activa la cámara para escanear banderas y mostrar modelos 3D en realidad aumentada.",
      position: 'top'
    },
    {
      element: document.querySelector('.hub-btn[data-action="video"]'),
      intro: "Descubre highlights y videos especiales del Mundial 2026 en un panel lateral.",
      position: 'top'
    },
    {
      element: document.querySelector('.hub-btn[data-action="datos"]'),
      intro: "Consulta datos y curiosidades en un formato tipo dashboard, sin abrir modales flotantes.",
      position: 'top'
    },
    {
      element: document.querySelector('.hub-btn[data-action="trivia"]'),
      intro: "Pon a prueba tus conocimientos con la trivia oficial del Mundial.",
      position: 'top'
    },
    {
      element: document.querySelector('.ra-viewer__stage'),
      intro: "Aquí vivirá la magia: verás la cámara y, sobre ella, los modelos 3D con las banderas detectadas.",
      position: 'left'
    },
    {
      element: document.getElementById('info-panel'),
      intro: "El panel contextual muestra videos, datos y la trivia en el mismo nivel de la página, sin oscurecer la escena.",
      position: 'left'
    },
    {
      intro: "¡Listo! Explora el Mundial con el nuevo dock y disfruta de la experiencia RA."
    }
  ];

  // Filtrar pasos donde el elemento existe
  const activeIntroSteps = introSteps.filter(step => {
    if (step.element) {
      return step.element !== null;
    }
    return true;
  });

  if (activeIntroSteps.length > 0) {
    introJs().setOptions({
      steps: activeIntroSteps,
      nextLabel: 'Siguiente →',
      prevLabel: '← Anterior',
      doneLabel: 'Finalizar',
      tooltipClass: 'introjs-custom-tooltip',
      showBullets: false,
    }).oncomplete(function() {
      localStorage.setItem(INTRO_KEY, '1');
    }).onexit(function() {
      localStorage.setItem(INTRO_KEY, '1');
    }).start();
  }
}

});
</script>
</body>
</html>
